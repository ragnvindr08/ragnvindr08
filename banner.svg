<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="JOHN STEVEN I. CASPE" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>JOHN STEVEN I. CASPE</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="0.5" stop-color="#111a2b"/>
      <stop offset="1" stop-color="#0b0f14"/>
    </linearGradient>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#61AFEF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>

    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" fill-opacity="0.35"/>
    </pattern>

    <!-- static noise -->
    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="4"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.38  0 0 0 0 0.68  0 0 0 0 0.94  0 0 0 0.5 0"/>
    </filter>

    <!-- glitch displacement (spikes every few seconds) -->
    <filter id="glitch" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.001 0.4" numOctaves="1" seed="2" result="n">
        <animate attributeName="seed" values="1;5;2;9;3;7;4;8" dur="0.6s" calcMode="discrete" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="0" xChannelSelector="R" yChannelSelector="G">
        <animate attributeName="scale" values="0;0;0;0;0;30;0;0;0;12;0;0;0;0;0;0" dur="3.5s" repeatCount="indefinite"/>
      </feDisplacementMap>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'JetBrains Mono', 'Cascadia Code', Consolas, 'Courier New', monospace; font-weight: 700; font-size: 42px; letter-spacing: 1px; }
    .cur  { animation: blink 1s steps(1) infinite; }
    .red  { animation: gr 3.5s steps(1) infinite; }
    .cyan { animation: gc 3.5s steps(1) infinite; }
    .sl   { opacity: 0; }
    .s1 { animation: sl 3.5s steps(1) infinite; }
    .s2 { animation: sl 3.5s steps(1) 0.35s infinite; }
    .s3 { animation: sl 3.5s steps(1) 1.1s infinite; }
    .s4 { animation: sl 3.5s steps(1) 1.9s infinite; }
    .flick { animation: flick 0.12s steps(1) infinite; }

    @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
    @keyframes gr {
      0%,82%,100% { transform: translate(0,0); opacity: 0 }
      83% { transform: translate(-7px,2px);  opacity: .9 }
      85% { transform: translate(6px,-2px);  opacity: .9 }
      87% { transform: translate(-3px,1px);  opacity: .9 }
      89% { transform: translate(0,0);       opacity: 0 }
      93% { transform: translate(5px,0);     opacity: .8 }
      95% { transform: translate(0,0);       opacity: 0 }
    }
    @keyframes gc {
      0%,82%,100% { transform: translate(0,0); opacity: 0 }
      83% { transform: translate(7px,-2px);  opacity: .9 }
      85% { transform: translate(-6px,2px);  opacity: .9 }
      87% { transform: translate(3px,-1px);  opacity: .9 }
      89% { transform: translate(0,0);       opacity: 0 }
      93% { transform: translate(-5px,0);    opacity: .8 }
      95% { transform: translate(0,0);       opacity: 0 }
    }
    @keyframes sl {
      0%,80%,100% { opacity: 0; transform: translateX(0) }
      81% { opacity: .55; transform: translateX(-40px) }
      84% { opacity: .35; transform: translateX(50px) }
      87% { opacity: .5;  transform: translateX(-20px) }
      90% { opacity: 0 }
    }
    @keyframes flick { 0% { opacity: .05 } 50% { opacity: .09 } 100% { opacity: .06 } }
  </style>

  <g filter="url(#glitch)">
    <!-- background -->
    <rect width="900" height="220" fill="url(#bg)"/>
    <rect width="900" height="220" fill="url(#grid)"/>
    <rect width="900" height="220" filter="url(#noise)" class="flick"/>

    <!-- glitch slices -->
    <rect class="sl s1" x="0" y="38"  width="900" height="10" fill="#61AFEF"/>
    <rect class="sl s2" x="0" y="96"  width="900" height="6"  fill="#ff0055"/>
    <rect class="sl s3" x="0" y="140" width="900" height="14" fill="#00fff0"/>
    <rect class="sl s4" x="0" y="178" width="900" height="8"  fill="#61AFEF"/>

    <!-- RGB-split layers -->
    <text class="mono red"  x="450" y="122" text-anchor="middle" fill="#ff0055">&gt; JOHN STEVEN I. CASPE_</text>
    <text class="mono cyan" x="450" y="122" text-anchor="middle" fill="#00fff0">&gt; JOHN STEVEN I. CASPE_</text>

    <!-- main text -->
    <text class="mono" x="450" y="122" text-anchor="middle" fill="#e6edf3">
      <tspan fill="#98c379">&gt;</tspan> JOHN STEVEN I. CASPE<tspan class="cur" fill="#61AFEF">_</tspan>
    </text>

    <!-- scanlines + bottom accent -->
    <rect width="900" height="220" fill="url(#scan)"/>
    <rect y="217" width="900" height="3" fill="#61AFEF" fill-opacity="0.8"/>
  </g>
</svg>
